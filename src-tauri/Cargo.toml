[package]
name = "autopia-manager"
version = "0.3.10"
description = "Software gestionale desktop per autodemolitori collegato ad Autopia"
authors = ["Autopia Team"]
license = "Proprietary"
repository = "https://github.com/jacobs133/autopia-manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
