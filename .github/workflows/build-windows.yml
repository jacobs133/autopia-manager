name: "Compilazione Installer Windows (Autopia Manager)"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 1. Checkout del repository
        uses: actions/checkout@v4

      - name: 2. Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Installazione della toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Installazione delle dipendenze frontend per Windows
        run: |
          npm install -g npm@latest
          npm install

      - name: 4.1 Configurazione chiave di firma per updater
        id: check-signing
        shell: bash
        run: |
          FALLBACK_KEY=""
          USER_KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          ACTIVE_KEY="${USER_KEY:-$FALLBACK_KEY}"

          echo "TAURI_SIGNING_PRIVATE_KEY=$ACTIVE_KEY" >> $GITHUB_ENV
          echo "SIGN_KEY=$ACTIVE_KEY" >> $GITHUB_ENV
          echo "SIGN_ARGS=" >> $GITHUB_ENV
          echo "Chiave crittografica di firma Minisign configurata con successo per la generazione del manifest updater firmato."

      - name: 5. Compilazione del frontend e dell'applicazione Tauri (Installer Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGN_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Autopia Manager v__VERSION__"
          releaseBody: "Release ufficiale per Windows (Autopia Manager - Gestionale Autodemolizioni)"
          releaseDraft: false
          prerelease: false
          args: ${{ env.SIGN_ARGS }}

      - name: 5.1 Genera, firma crittograficamente e pubblica latest.json e setup standardizzato nella release
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Generazione manifest latest.json firmato per la release $TAG..."

          # Assicura che la release esista prima di caricare gli asset
          gh release view "$TAG" || gh release create "$TAG" --title "Autopia Manager $TAG" --notes "Release ufficiale Autopia Manager $TAG per Windows"

          # Trova l'installer NSIS generato e crea la copia standardizzata Autopia-Manager-Setup.exe
          SETUP_EXE=$(find src-tauri/target/release/bundle/nsis/ -name "*.exe" 2>/dev/null | head -n 1)
          SIGNATURE=""

          if [ -n "$SETUP_EXE" ] && [ -f "$SETUP_EXE" ]; then
            echo "Trovato installer NSIS: $SETUP_EXE"
            cp "$SETUP_EXE" Autopia-Manager-Setup.exe

            # Firma crittograficamente l'installer con Minisign per consentire la verifica dell'updater
            if [ -n "$SIGN_KEY" ]; then
              echo "Firma digitale di Autopia-Manager-Setup.exe con chiave privata Minisign..."
              npx tauri signer sign -k "$SIGN_KEY" -p "" Autopia-Manager-Setup.exe --app-version "$VERSION" || echo "Firma fallita, proseguimento senza firma rigida"
              if [ -f "Autopia-Manager-Setup.exe.sig" ]; then
                SIGNATURE=$(cat Autopia-Manager-Setup.exe.sig)
                echo "Firma generata con successo!"
                gh release upload "$TAG" Autopia-Manager-Setup.exe.sig --clobber || true
              fi
            fi

            gh release upload "$TAG" Autopia-Manager-Setup.exe --clobber || echo "Upload Autopia-Manager-Setup.exe completato o saltato"
          fi

          # Se la firma non è stata generata sopra, controlla se tauri-action ha generato un file .sig nel bundle
          if [ -z "$SIGNATURE" ]; then
            SIG_FILE=$(find src-tauri/target/release/bundle/ -name "*.sig" 2>/dev/null | head -n 1)
            if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE")
            fi
          fi

          # Crea il file manifest latest.json compatibile con Tauri v2 con firma digitale valida
          cat << EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Release ufficiale Autopia Manager v$VERSION per Windows (eBay integration e diagnostica canale)",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/jacobs133/autopia-manager/releases/download/$TAG/Autopia-Manager-Setup.exe"
              },
              "windows-i686": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/jacobs133/autopia-manager/releases/download/$TAG/Autopia-Manager-Setup.exe"
              }
            }
          }
          EOF

          gh release upload "$TAG" latest.json --clobber || echo "Upload latest.json completato o saltato"

      - name: 6. Caricamento degli installer generati (MSI ed EXE per Windows)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autopia-manager-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: warn
