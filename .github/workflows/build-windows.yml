name: "Compilazione Installer Windows (Autopia Manager)"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 1. Checkout del repository
        uses: actions/checkout@v4

      - name: 2. Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Installazione della toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Installazione delle dipendenze frontend per Windows
        run: |
          npm install -g npm@latest
          npm install

      - name: 5. Compilazione del frontend e dell'applicazione Tauri (Installer Windows & Updater Artifacts)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Autopia Manager v__VERSION__"
          releaseBody: "Release ufficiale per Windows (Autopia Manager - Gestionale Autodemolizioni)"
          releaseDraft: false
          prerelease: false

      - name: 5.1 Verifica e pubblicazione artefatti di installazione e manifest latest.json
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Verifica asset e manifest latest.json per la release $TAG..."

          # Assicura che la release esista, sia associata al commit corrente e sia contrassegnata come LATEST
          gh release view "$TAG" || gh release create "$TAG" --target "$GITHUB_SHA" --title "Autopia Manager $TAG" --notes "Release ufficiale Autopia Manager $TAG per Windows" --latest

          # Imposta esplicitamente questa release come LATEST assoluta su GitHub (sostituendo v0.3.8)
          gh release edit "$TAG" --latest --draft=false || true

          # Trova l'installer NSIS generato e crea la copia standardizzata Autopia-Manager-Setup.exe per download diretto se richiesto
          SETUP_EXE=$(find src-tauri/target/release/bundle/nsis/ -name "*.exe" 2>/dev/null | head -n 1)
          if [ -n "$SETUP_EXE" ] && [ -f "$SETUP_EXE" ]; then
            echo "Trovato installer NSIS: $SETUP_EXE"
            cp "$SETUP_EXE" Autopia-Manager-Setup.exe
            gh release upload "$TAG" Autopia-Manager-Setup.exe --clobber || true
          fi

          # Se tauri-action ha generato latest.json, assicuriamoci che sia presente nella release
          LATEST_JSON=$(find src-tauri/target/release/bundle/ -name "latest.json" 2>/dev/null | head -n 1)
          if [ -n "$LATEST_JSON" ] && [ -f "$LATEST_JSON" ]; then
            echo "Trovato latest.json generato ufficialmente da Tauri: $LATEST_JSON"
            cat "$LATEST_JSON"
            gh release upload "$TAG" "$LATEST_JSON" --clobber || true
          else
            echo "Nota: latest.json gestito automaticamente da tauri-action."
          fi

      - name: 6. Caricamento degli installer generati (MSI ed EXE per Windows)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autopia-manager-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: warn
