name: "Compilazione Installer Windows (Autopia Manager)"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 1. Checkout del repository
        uses: actions/checkout@v4

      - name: 2. Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Installazione della toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Installazione delle dipendenze frontend e binding nativo Windows
        run: |
          npm ci
          npm install @tauri-apps/cli-win32-x64-msvc --no-save

      - name: 5. Compilazione del frontend e dell'applicazione Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: autopia-manager-v__VERSION__
          releaseName: "Autopia Manager v__VERSION__"
          releaseBody: "Release automatica per Windows (Autopia Manager - Gestionale Autodemolizioni)"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 6. Caricamento degli installer generati (MSI ed EXE)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopia-manager-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
